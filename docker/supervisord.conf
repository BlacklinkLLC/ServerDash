[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
; Not under /tmp: an operator mounting a host directory in for workflow
; blocks (git_pull/compose_up) may mount over /tmp, which would otherwise
; make supervisord unable to write its own pidfile.
pidfile=/run/supervisord.pid

[program:serverdash-api]
command=/app/serverdash
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:serverdash-web]
command=node /app/web/server/index.js
directory=/app/web
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
