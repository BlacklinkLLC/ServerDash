services:
  serverdash:
    build: .
    image: serverdash:latest
    container_name: serverdash
    restart: unless-stopped
    # Shares the host's PID namespace. Without this, the container can only
    # see its own mount table (via /proc/self), not the host's, because
    # reading another PID namespace's /proc/1/mountinfo needs it — so disk
    # usage would silently report the container's own filesystem instead
    # of the host's. Same pattern used by Netdata/cAdvisor.
    pid: host
    ports:
      - "${SERVERDASH_PORT:-9900}:9900"
    environment:
      SERVERDASH_PUBLIC_HOST: "${SERVERDASH_PUBLIC_HOST:-nova.blacklink.net}"
      SERVERDASH_DOCKER_HOST: "${SERVERDASH_DOCKER_HOST:-unix:///var/run/docker.sock}"
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      SERVERDASH_HOST_ROOT: /rootfs
      # Only needed if you uncomment the kubeconfig mount below.
      SERVERDASH_KUBECONFIG: "${SERVERDASH_KUBECONFIG:-}"
      # Used by a workflow's "Rebuild & Run" block; see the workflow mount
      # note further down for the rest of what that block needs.
      SERVERDASH_COMPOSE_CMD: "${SERVERDASH_COMPOSE_CMD:-docker compose}"
    volumes:
      # Users, sessions, nicknames, automation rules, and scripts (SQLite).
      - serverdash-data:/data
      # Full control over every container on the host — equivalent to root.
      # For Podman, point this at its socket instead (e.g.
      # /run/user/1000/podman/podman.sock) and update SERVERDASH_DOCKER_HOST
      # to match. Not mounted read-only: starting/stopping containers needs
      # a writable connection to the socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # Host metrics (CPU/mem/load): gopsutil reads these via HOST_PROC/
      # HOST_SYS above instead of the container's own /proc, /sys.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Host disk usage: mountpoints discovered via /host/proc/1/mountinfo
      # (e.g. /boot) only exist in the *host's* mount namespace, so they're
      # statted here instead of at their raw path. rslave propagation makes
      # the host's nested mounts (not just its top-level root) show up too.
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          propagation: rslave
      # Kubernetes support (optional): uncomment, then set
      # SERVERDASH_KUBECONFIG=/kubeconfig in .env to manage a cluster from
      # the dashboard. Leave both commented out and ServerDash just reports
      # Kubernetes as unavailable.
      # - ${KUBECONFIG:-~/.kube/config}:/kubeconfig:ro
      #
      # Workflow blocks (optional): git_pull and compose_up run against a
      # directory you name in the workflow, e.g. "/opt/myapp" — that path
      # has to exist inside *this* container too, at the same path it has
      # on the host, so mount whatever parent directory holds your deployed
      # projects (not /tmp — see the note on security_opt below).
      # - /opt:/opt
    # On SELinux-enforcing hosts (Fedora/RHEL/CentOS) only: the mounted
    # directories above need :Z (e.g. "/opt:/opt:Z") to be readable at all.
    # That alone isn't enough for the git_pull/compose_up blocks specifically
    # — SELinux's container policy separately blocks a container's own
    # nested `docker`/`git` CLI calls against the mounted docker.sock, even
    # though the dashboard's own container list/start/stop/restart (which
    # goes straight to the Engine API, not through the CLI) works fine
    # either way. If you want those two workflow block types, uncomment
    # this — it runs ServerDash unconfined, weakening the isolation SELinux
    # normally gives a container; skip it if you don't need them.
    # security_opt:
    #   - label=disable

volumes:
  serverdash-data:
